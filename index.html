<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oasis — Admin Dashboard</title>
<meta name="description" content="Oasis — Clinical Nutrition Support Tool Admin Dashboard">
<meta name="theme-color" content="#080f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oasis Admin">
<link id="pwa-manifest" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Nunito:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@15/dist/iife/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<link rel="stylesheet" href="assets/css/styles.css">
<script src="js/orientation_manager.js"></script>
</head>
<body>

<div id="crash-log" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#001a33;color:#0ff;font:10px monospace;padding:8px;white-space:pre-wrap;max-height:45vh;overflow:auto;"></div>
<script>
  function showCrash(msg) {
    var el = document.getElementById('crash-log');
    el.textContent += msg + '\n\n';
  }
  window.addEventListener('error', function(e) {
    showCrash('ERROR: ' + e.message + '\nFile: ' + (e.filename||'?') + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', function(e) {
    showCrash('PROMISE REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function() {
    var sels = ['#app','.dashboard-body','.sidebar','.top-tab-nav','.bottom-tab-nav','.content-area','#login-screen'];
    var out = '--- LAYOUT DUMP ---\n';
    sels.forEach(function(sel) {
      var el = document.querySelector(sel);
      if (!el) { out += sel + ': NOT IN DOM\n'; return; }
      var cs = getComputedStyle(el);
      var r = el.getBoundingClientRect();
      out += sel + ': display=' + cs.display + ' position=' + cs.position +
             ' top=' + Math.round(r.top) + ' bottom=' + Math.round(r.bottom) +
             ' height=' + Math.round(r.height) + ' width=' + Math.round(r.width) +
             ' transform=' + cs.transform + '\n';
    });
    var vh = getComputedStyle(document.documentElement).getPropertyValue('--vh');
    out += 'html --vh = ' + vh + '\n';
    out += 'window.innerHeight = ' + window.innerHeight + '\n';
    showCrash(out);
  }, 2500);
</script>

<div id="app-root">
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
